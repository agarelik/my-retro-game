<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8/>
  <meta name=viewport content=width=device-width,initial-scale=1.0/>
  <title>Pac-Kiro</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;
         justify-content:center;min-height:100vh;
         font-family:'Courier New',monospace;color:#fff}
    h1{font-size:2.2rem;color:#790ECB;letter-spacing:.15em;margin-bottom:10px;
       text-shadow:0 0 20px #790ECB88}
    #hud{display:flex;justify-content:space-between;width:560px;padding:6px 4px;
         font-size:1rem;color:#c084fc}
    canvas{display:block;border:2px solid #790ECB;
           box-shadow:0 0 30px #790ECB55,0 0 60px #790ECB22;background:#0a0a0a}
    #msg{margin-top:10px;font-size:.85rem;color:#a78bfa;
         letter-spacing:.08em;min-height:1.3em;text-align:center}
  </style>
</head>
<body>
<h1>PAC-KIRO</h1>
<div id=hud>
  <span>SCORE: <span id=sc>0</span></span>
  <span>HI: <span id=hi>0</span></span>
  <span>LIVES: <span id=lv>3</span></span>
</div>
<canvas id=c width=560 height=560></canvas>
<div id=msg>Loading...</div>
</body>
</html>
